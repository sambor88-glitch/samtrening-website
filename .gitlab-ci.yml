# GitLab Pages — publikuje statyczny prototyp z katalogu prototype/.
#
# Prototyp jest archiwum designu z kwietnia 2026, nie kodem produkcyjnym.
# Strona produkcyjna to WordPress z motywem z theme/ — patrz docs/wdrozenie-motywu.md.

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp -r prototype/. public/
    - echo "Prototyp skopiowany do public/. Strona bedzie dostepna po zakonczeniu pipeline."
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
